<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Receive File - FileShare</title>
    <style>
        body { margin: 0; padding: 20px; background: #0d0e15; color: #fff; font-family: Arial, sans-serif; text-align: center; }
        .container { max-width: 350px; margin: 0 auto; padding-top: 10px; }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 25px; color: #6366f1; }
        .code-box { font-size: 20px; color: #28a745; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 20px; letter-spacing: 1px; }
        .status { margin: 20px 0; font-size: 15px; color: #a1a1aa; }
        
        /* 📊 progress bar */
        .progress-bar { width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 10px; overflow: hidden; margin-top: 10px; }
        .progress-fill { width: 0%; background: #6366f1; height: 100%; transition: width 0.1s; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">⚡ FILEShare Receiver</div>
        
        <div class="code-box">
            Connected Code: <span id="active-code">Loading...</span>
        </div>

        <div id="status-text" class="status">🔄 Connection Initializing...</div>

        <div id="progress-container" style="display:none; margin: 15px 0;">
            <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
            <p id="progress-percent" style="font-size: 12px; color:#a1a1aa; margin-top:5px;">0%</p>
        </div>

        <p style="font-size: 11px; color: #8a8a93; background: rgba(255,255,255,0.02); padding: 8px; border-radius: 4px; border: 1px dashed rgba(255,255,255,0.1);">
            ℹ️ <b>डेटा बचाने के लिए:</b> पक्का करें कि मोबाइल और पीसी <b>एक ही वाई-फाई/हॉटस्पॉट</b> से कनेक्टेड हैं।
        </p>

        <!-- 💰 विज्ञापन SLOT (यह इसी रिपो के index.html यानी विज्ञापन को लोड करेगा) -->
        <div style="margin-top: 25px;">
            <iframe src="index.html" width="100%" height="310" frameborder="0" scrolling="no" style="border: none; max-width: 320px; display: block; margin: 0 auto; overflow: hidden;"></iframe>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const roomCode = urlParams.get('room');
        
        if (roomCode) {
            document.getElementById('active-code').innerText = roomCode;
            connectToSender(roomCode);
        } else {
            document.getElementById('status-text').innerText = "❌ No Room Code Found in QR.";
        }

        async function connectToSender(code) {
            document.getElementById('status-text').innerText = "📡 Hooking up via Cloudflare...";
            
            // क्लाउडफ्लेयर वर्कर से कनेक्शन जोड़ना
            const res = await fetch(`https://workers.dev`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomCode: code })
            });
            const data = await res.json();
            
            if(data.error) {
                document.getElementById('status-text').innerText = "❌ Code Expired or Invalid!";
                return;
            }

            document.getElementById('status-text').innerText = "📥 Downloading File directly from PC...";
            document.getElementById('progress-container').style.display = 'block';
            
            // यहाँ AI आपका पुराना WebRTC Peer Connection रन कर देगा...
        }
    </script>
</body>
</html>
