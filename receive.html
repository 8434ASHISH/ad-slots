<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚡ Receive File - FileShare</title>
    <style>
        body {
            margin: 0; padding: 20px;
            background: #0d0e15; color: #fff;
            font-family: Arial, sans-serif; text-align: center;
        }
        .container { max-width: 350px; margin: 0 auto; padding-top: 20px; }
        .logo { font-size: 24px; font-weight: bold; margin-bottom: 20px; color: #6366f1; }
        
        /* ⌨️ कोड इनपुट बॉक्स */
        .code-input {
            width: 80%; padding: 12px; font-size: 18px;
            border-radius: 8px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: #fff;
            text-align: center; letter-spacing: 3px; margin-bottom: 15px;
        }
        .btn-receive {
            width: 85%; padding: 12px; font-size: 16px; font-weight: bold;
            background: linear-gradient(135deg, #6366f1, #a855f7);
            border: none; border-radius: 8px; color: white; cursor: pointer;
        }
        
        /* 📊 प्रोग进度条 (Progress Bar) */
        .progress-container { display: none; margin: 20px 0; }
        .progress-bar { width: 100%; background: rgba(255,255,255,0.1); border-radius: 10px; height: 10px; overflow: hidden; }
        .progress-fill { width: 0%; background: #6366f1; height: 100%; transition: width 0.1s; }
        
        /* 📶 नेटवर्क निर्देश */
        .network-tip {
            font-size: 12px; color: #a1a1aa; background: rgba(255,255,255,0.02);
            padding: 10px; border-radius: 6px; margin: 20px 0; border: 1px dashed rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">⚡ UltraShare Receiver</div>
        
        <!-- कोड एंट्री स्क्रीन -->
        <div id="setup-screen">
            <p style="color: #a1a1aa; font-size: 14px;">सेंडर का 6-डिजिट कोड डालें</p>
            <input type="text" id="roomCodeInput" class="code-input" placeholder="000000" maxlength="6">
            <button id="receiveBtn" class="btn-receive">Connect & Download</button>
        </div>

        <!-- ट्रांसफर स्क्रीन + प्रोग्रेस बार -->
        <div id="transfer-screen" class="progress-container">
            <p id="status-text" style="color: #28a745;">Connecting to Peer...</p>
            <div class="progress-bar">
                <div id="progressFill" class="progress-fill"></div>
            </div>
            <p id="progress-percent" style="font-size: 12px; color:#a1a1aa;">0%</p>
        </div>

        <!-- 📶 निर्देश -->
        <div class="network-tip">
            ℹ️ <b>डेटा बचाने के लिए:</b> पक्का करें कि दोनों डिवाइसेस <b>एक ही वाई-फाई या हॉटस्पॉट</b> से जुड़े हैं ताकि इंटरनेट डेटा (MB/GB) खर्च न हो।
        </div>

        <!-- 💰 विज्ञापन SLOT (बिना कटे परफेक्ट फिट) -->
        <div style="margin-top: 20px;">
            <iframe src="https://workers.dev" width="100%" height="320" frameborder="0" scrolling="no" style="border: none; max-width: 320px; display: block; margin: 0 auto; overflow: hidden;"></iframe>
        </div>
    </div>

    <script>
        // ─── 📡 WebRTC Receiver Logic ───
        let remoteConnection;
        const workerUrl = "https://workers.dev";

        // URL से ऑटोमैटिक रूम कोड पढ़ना (यदि QR Code से स्कैन किया हो)
        const urlParams = new URLSearchParams(window.location.search);
        const qrCode = urlParams.get('room');
        if(qrCode) {
            document.getElementById('roomCodeInput').value = qrCode;
            startReceiving(qrCode);
        }

        document.getElementById('receiveBtn').addEventListener('click', () => {
            const code = document.getElementById('roomCodeInput').value;
            if(code.length === 6) startReceiving(code);
        });

        async function startReceiving(roomCode) {
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('transfer-screen').style.display = 'block';

            remoteConnection = new RTCPeerConnection({
                iceServers: [{ urls: 'stun:://google.com' }]
            });

            // क्लाउडफ्लेयर से सेंडर का न्योता (Offer) लेना
            const res = await fetch(`${workerUrl}/api/join-room`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ roomCode })
            });
            const data = await res.json();
            
            if(data.error) {
                alert(data.error);
                location.reload();
                return;
            }

            // WebRTC डेटा चैनल के ज़रिए फ़ाइल के टुकड़े रिसीव करना
            remoteConnection.ondatachannel = (event) => {
                const receiveChannel = event.channel;
                let receivedChunks = [];
                
                receiveChannel.onmessage = (e) => {
                    if (e.data === "DONE") {
                        document.getElementById('status-text').innerText = "✅ Download Complete!";
                        const blob = new Blob(receivedChunks);
                        const link = document.createElement('a');
                        link.href = URL.createObjectURL(blob);
                        link.download = "UltraShare_File";
                        link.click();
                    } else {
                        receivedChunks.push(e.data);
                        // प्रोग्रेस बार अपडेट (डेमो लॉजिक - कर्सर इसे पूरी फाइल साइज से सिंक कर देगा)
                        document.getElementById('status-text').innerText = "📥 Downloading file...";
                    }
                };
            };

            await remoteConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        }
    </script>
</body>
</html>
