<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraShare Ads Slot</title>
    <link rel="stylesheet" href="style.css">
    
    <!-- 💰 यहाँ अपना Monetag या Adsterra का स्क्रिप्ट कोड डालें -->
    <!-- (अगर स्क्रिप्ट कोड खो गया है, तो डायरेक्ट Monetag सपोर्ट से न्यू टैग ले लें या केवल अपनी Zone ID यहाँ बदलें) -->
    <script>(function(s,u,z,p,v,e,d){p=s.createElement(u);p.async=1;p.src=z;in=s.getElementsByTagName(u);in.parentNode.insertBefore(p,in);})(window,document,"//://heygizmo.com",window);</script>
</head>
<body>

    <div class="ads-wrapper">
        <!-- 🎯 विज्ञापन बॉक्स: अब यह बिना किसी फालतू टेक्स्ट के सीधा टॉप पर लोड होगा -->
        <div class="ad-card">
            <span class="ad-label">✦ SPONSORED CONTENT ✦</span>
            <div class="ad-slot-frame">
                <!-- आपका विज्ञापन यहाँ बिना कटे लोड होगा -->
                <div id="monetag-ad-placement"></div>
            </div>
        </div>

        <!-- 📄 लीगल लिंक्स -->
        <div class="legal-box">
            <div class="links-grid">
                <a href="privacy.html" target="_blank">Privacy Policy</a>
                <a href="disclaimer.html" target="_blank">Disclaimer</a>
                <a href="contact.html" target="_blank">Contact</a>
            </div>
        </div>
    </div>

</body>
</html>
