<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestureFX - AI Particle System</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --glass: rgba(255, 255, 255, 0.05);
            --border: rgba(255, 255, 255, 0.1);
        }

        body { margin: 0; overflow: hidden; background: #000; font-family: 'Inter', sans-serif; color: white; }
        
        /* 3D Canvas */
        #canvas-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* Webcam Feed (Hidden but active) */
        #video-input { display: none; }

        /* Dashboard UI (AdSense Friendly Layout) */
        .dashboard {
            position: absolute;
            right: 0;
            top: 0;
            width: 300px;
            height: 100%;
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: blur(12px);
            border-left: 1px solid var(--border);
            z-index: 10;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            transition: transform 0.3s ease;
        }

        .header { margin-bottom: 20px; border-bottom: 1px solid var(--border); padding-bottom: 10px; }
        .header h1 { font-size: 1.2rem; margin: 0; background: linear-gradient(45deg, #fff, #6366f1); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .status { font-size: 0.8rem; color: #4ade80; margin-top: 5px; display: flex; align-items: center; gap: 5px; }
        
        .control-group { margin-bottom: 20px; }
        .control-group label { display: block; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #888; margin-bottom: 8px; }
        
        .btn {
            background: var(--glass);
            border: 1px solid var(--border);
            color: white;
            padding: 10px;
            width: 100%;
            cursor: pointer;
            margin-bottom: 8px;
            border-radius: 6px;
            transition: 0.2s;
            text-align: left;
            display: flex;
            justify-content: space-between;
        }
        .btn:hover, .btn.active { background: var(--primary); border-color: var(--primary); }
        
        .stats-panel {
            margin-top: auto;
            font-size: 0.75rem;
            color: #666;
            border-top: 1px solid var(--border);
            padding-top: 15px;
        }

        /* AdSense Placeholder Area */
        .ad-space {
            width: 100%;
            height: 250px;
            background: rgba(255,255,255,0.02);
            border: 1px dashed var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #444;
            font-size: 0.8rem;
            margin-top: 20px;
            border-radius: 8px;
        }

        /* Loading Overlay */
        #loader {
            position: fixed; inset: 0; background: #000; z-index: 100;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
        }
        .spinner { width: 40px; height: 40px; border: 3px solid #333; border-top-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

    </style>
</head>
<body>

    <div id="loader">
        <div class="spinner"></div>
        <p style="margin-top:15px; font-size: 0.9rem; opacity: 0.7;">Initializing AI Vision...</p>
    </div>

    <video id="video-input"></video>

    <div id="canvas-container"></div>

    <aside class="dashboard">
        <div class="header">
            <h1>GestureFX Engine</h1>
            <div class="status"><span style="width:8px; height:8px; background:#4ade80; border-radius:50%;"></span> AI Tracking Active</div>
        </div>

        <div class="control-group">
            <label>Current Template</label>
            <button class="btn active" onclick="setShape('sphere')">🔮 Sphere Field</button>
            <button class="btn" onclick="setShape('heart')">❤️ Cyber Heart</button>
            <button class="btn" onclick="setShape('saturn')">🪐 Saturn Ring</button>
            <button class="btn" onclick="setShape('flower')">🌸 Digital Flower</button>
        </div>

        <div class="control-group">
            <label>Gesture Info</label>
            <div style="font-size: 0.85rem; color: #ccc; line-height: 1.5;">
                👉 <b>Index Finger:</b> Move Particles<br>
                ✊ <b>Pinch:</b> Trigger Expansion<br>
                👋 <b>Open Hand:</b> Change Colors
            </div>
        </div>

        <div class="ad-space">
            Advertisement Area
        </div>

        <div class="stats-panel">
            <p>Particles: <span id="p-count">15,000</span></p>
            <p>FPS: <span id="fps-counter">60</span></p>
            <div style="margin-top: 10px; display: flex; gap: 10px;">
                <a href="#" style="color:#666; text-decoration:none;">Privacy</a>
                <a href="#" style="color:#666; text-decoration:none;">Terms</a>
            </div>
        </div>
    </aside>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script type="x-shader/x-vertex" id="vertexshader">
        attribute float size;
        attribute vec3 customColor;
        attribute vec3 targetPosition;
        
        varying vec3 vColor;
        
        uniform float uTime;
        uniform float uMixFactor;
        uniform vec3 uMouse;
        uniform float uExpand;

        // Simplex noise function (simplified)
        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 mod289(vec4 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec4 permute(vec4 x) { return mod289(((x*34.0)+1.0)*x); }
        vec4 taylorInvSqrt(vec4 r) { return 1.79284291400159 - 0.85373472095314 * r; }
        float snoise(vec3 v) {
            const vec2 C = vec2(1.0/6.0, 1.0/3.0);
            const vec4 D = vec4(0.0, 0.5, 1.0, 2.0);
            vec3 i  = floor(v + dot(v, C.yyy) );
            vec3 x0 = v - i + dot(i, C.xxx) ;
            vec3 g = step(x0.yzx, x0.xyz);
            vec3 l = 1.0 - g;
            vec3 i1 = min( g.xyz, l.zxy );
            vec3 i2 = max( g.xyz, l.zxy );
            vec3 x1 = x0 - i1 + C.xxx;
            vec3 x2 = x0 - i2 + C.yyy;
            vec3 x3 = x0 - D.yyy;
            i = mod289(i);
            vec4 p = permute( permute( permute( 
                        i.z + vec4(0.0, i1.z, i2.z, 1.0 ))
                    + i.y + vec4(0.0, i1.y, i2.y, 1.0 )) 
                    + i.x + vec4(0.0, i1.x, i2.x, 1.0 ));
            float n_ = 0.142857142857;
            vec3  ns = n_ * D.wyz - D.xzx;
            vec4 j = p - 49.0 * floor(p * ns.z * ns.z);
            vec4 x_ = floor(j * ns.z);
            vec4 y_ = floor(j - 7.0 * x_ );
            vec4 x = x_ *ns.x + ns.yyyy;
            vec4 y = y_ *ns.x + ns.yyyy;
            vec4 h = 1.0 - abs(x) - abs(y);
            vec4 b0 = vec4( x.xy, y.xy );
            vec4 b1 = vec4( x.zw, y.zw );
            vec4 s0 = floor(b0)*2.0 + 1.0;
            vec4 s1 = floor(b1)*2.0 + 1.0;
            vec4 sh = -step(h, vec4(0.0));
            vec4 a0 = b0.xzyw + s0.xzyw*sh.xxyy ;
            vec4 a1 = b1.xzyw + s1.xzyw*sh.zzww ;
            vec3 p0 = vec3(a0.xy,h.x);
            vec3 p1 = vec3(a0.zw,h.y);
            vec3 p2 = vec3(a1.xy,h.z);
            vec3 p3 = vec3(a1.zw,h.w);
            vec4 norm = taylorInvSqrt(vec4(dot(p0,p0), dot(p1,p1), dot(p2, p2), dot(p3,p3)));
            p0 *= norm.x; p1 *= norm.y; p2 *= norm.z; p3 *= norm.w;
            vec4 m = max(0.6 - vec4(dot(x0,x0), dot(x1,x1), dot(x2,x2), dot(x3,x3)), 0.0);
            m = m * m;
            return 42.0 * dot( m*m, vec4( dot(p0,x0), dot(p1,x1), dot(p2,x2), dot(p3,x3) ) );
        }

        void main() {
            vColor = customColor;
            
            // Mix between current pos and target shape pos
            vec3 mixedPos = mix(position, targetPosition, uMixFactor);

            // Hand Interaction: Repel/Attract
            float dist = distance(mixedPos.xy, uMouse.xy * 10.0); // Simple 2D projection logic
            float influence = smoothstep(5.0, 0.0, dist);
            vec3 dir = normalize(mixedPos - vec3(uMouse.xy * 10.0, 0.0));
            
            // Expansion gesture logic
            vec3 finalPos = mixedPos + (dir * influence * 2.0) + (normal * uExpand * snoise(mixedPos * 0.5 + uTime));

            vec4 mvPosition = modelViewMatrix * vec4(finalPos, 1.0);
            gl_PointSize = size * (300.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;
        }
    </script>

    <script type="x-shader/x-fragment" id="fragmentshader">
        uniform vec3 uColor;
        uniform sampler2D pointTexture;
        varying vec3 vColor;

        void main() {
            gl_FragColor = vec4(uColor * vColor, 1.0);
            
            // Circular particle shape
            vec2 coord = gl_PointCoord - vec2(0.5);
            if(length(coord) > 0.5) discard;
        }
    </script>

    <script>
        // --- 1. CONFIGURATION ---
        const PARTICLE_COUNT = 15000;
        let scene, camera, renderer, particles;
        let uniforms, geometry;
        let videoElement = document.getElementById('video-input');
        
        // --- 2. THREE.JS SETUP ---
        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 30;

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            // Geometry & Attributes
            geometry = new THREE.BufferGeometry();
            const positions = [];
            const targetPositions = [];
            const colors = [];
            const sizes = [];

            const color = new THREE.Color();

            for (let i = 0; i < PARTICLE_COUNT; i++) {
                // Initial: Sphere
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const r = 10 + Math.random() * 0.5;

                positions.push(r * Math.sin(phi) * Math.cos(theta));
                positions.push(r * Math.sin(phi) * Math.sin(theta));
                positions.push(r * Math.cos(phi));

                // Target: Initialize same as pos
                targetPositions.push(0, 0, 0);

                // Colors
                color.setHSL(i / PARTICLE_COUNT, 1.0, 0.5);
                colors.push(color.r, color.g, color.b);

                sizes.push(Math.random() * 2);
            }

            geometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
            geometry.setAttribute('targetPosition', new THREE.Float32BufferAttribute(positions, 3)); // Initialize target same as pos
            geometry.setAttribute('customColor', new THREE.Float32BufferAttribute(colors, 3));
            geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));

            // Shader Material
            uniforms = {
                uTime: { value: 0.0 },
                uColor: { value: new THREE.Color(0xffffff) },
                uMouse: { value: new THREE.Vector3(0, 0, 0) },
                uMixFactor: { value: 0.0 }, // 0 = Position, 1 = TargetPosition
                uExpand: { value: 0.0 }
            };

            const material = new THREE.ShaderMaterial({
                uniforms: uniforms,
                vertexShader: document.getElementById('vertexshader').textContent,
                fragmentShader: document.getElementById('fragmentshader').textContent,
                blending: THREE.AdditiveBlending,
                depthTest: false,
                transparent: true
            });

            particles = new THREE.Points(geometry, material);
            scene.add(particles);

            window.addEventListener('resize', onWindowResize, false);
            calculateShape('sphere'); // Pre-calc target
        }

        // --- 3. SHAPE MATHS ---
        function calculateShape(type) {
            const targetAttribute = geometry.attributes.targetPosition;
            const count = PARTICLE_COUNT;

            for (let i = 0; i < count; i++) {
                let x, y, z;
                const i3 = i * 3;

                if (type === 'sphere') {
                    const theta = Math.random() * Math.PI * 2;
                    const phi = Math.acos((Math.random() * 2) - 1);
                    const r = 10;
                    x = r * Math.sin(phi) * Math.cos(theta);
                    y = r * Math.sin(phi) * Math.sin(theta);
                    z = r * Math.cos(phi);
                } else if (type === 'heart') {
                    // Heart formula
                    const t = Math.random() * Math.PI * 2;
                    const r = Math.random(); // volume
                    // Parametric equations roughly approximating a 3D heart
                    x = 16 * Math.pow(Math.sin(t), 3);
                    y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
                    z = (Math.random() - 0.5) * 5; 
                    // Scale down
                    x *= 0.5; y *= 0.5;
                } else if (type === 'saturn') {
                    const angle = Math.random() * Math.PI * 2;
                    // 70% particles in ring, 30% in planet
                    if (Math.random() > 0.3) {
                        const r = 12 + Math.random() * 4;
                        x = r * Math.cos(angle);
                        z = r * Math.sin(angle);
                        y = (Math.random() - 0.5) * 0.5;
                    } else {
                        const r = 6;
                        const phi = Math.acos((Math.random() * 2) - 1);
                        x = r * Math.sin(phi) * Math.cos(angle);
                        y = r * Math.sin(phi) * Math.sin(angle);
                        z = r * Math.cos(phi);
                    }
                } else if (type === 'flower') {
                    const u = Math.random() * Math.PI * 2;
                    const v = Math.random() * Math.PI;
                    const r = 5 * (1 + 0.5 * Math.sin(5 * u) * Math.sin(5 * v));
                    x = r * Math.sin(v) * Math.cos(u);
                    y = r * Math.sin(v) * Math.sin(u);
                    z = r * Math.cos(v) * 0.5; // Flatten slightly
                }

                targetAttribute.array[i3] = x;
                targetAttribute.array[i3 + 1] = y;
                targetAttribute.array[i3 + 2] = z;
            }
            targetAttribute.needsUpdate = true;
            
            // Animation Trigger
            startMorph();
        }

        let morphProgress = 0;
        function startMorph() {
            morphProgress = 0;
        }

        function animateMorph() {
            if (morphProgress < 1) {
                morphProgress += 0.02;
                uniforms.uMixFactor.value = morphProgress;
            }
        }

        window.setShape = function(shapeName) {
            calculateShape(shapeName);
            // UI Update
            document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
        };

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 4. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            uniforms.uTime.value += 0.05;
            animateMorph();
            
            particles.rotation.y += 0.002;
            
            renderer.render(scene, camera);
            
            // Stats update
            if (Math.random() > 0.95) {
                document.getElementById('fps-counter').innerText = Math.round(1000 / 16); // Fake simple FPS for demo
            }
        }

        // --- 5. MEDIAPIPE HAND TRACKING ---
        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraFeed = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });

        function onResults(results) {
            document.getElementById('loader').style.display = 'none';

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];
                
                // 1. Position Tracking (Index Finger Tip - Landmark 8)
                const indexFinger = landmarks[8];
                // Map 0..1 to -10..10 roughly for scene space
                const x = (0.5 - indexFinger.x) * 20; 
                const y = (0.5 - indexFinger.y) * 20;
                uniforms.uMouse.value.set(x, y, 0);

                // 2. Pinch Detection (Thumb tip 4 vs Index tip 8)
                const thumb = landmarks[4];
                const distance = Math.hypot(thumb.x - indexFinger.x, thumb.y - indexFinger.y);
                
                if (distance < 0.05) {
                    // PINCH: Color shift
                    uniforms.uColor.value.setHSL(Math.random(), 1.0, 0.5);
                }

                // 3. Open Hand Expansion (Wrist 0 to Middle Finger Tip 12)
                const wrist = landmarks[0];
                const middle = landmarks[12];
                const handSpan = Math.hypot(wrist.x - middle.x, wrist.y - middle.y);
                
                if (handSpan > 0.4) {
                    // OPEN HAND: Expansion
                    uniforms.uExpand.value = THREE.MathUtils.lerp(uniforms.uExpand.value, 5.0, 0.1);
                } else {
                    uniforms.uExpand.value = THREE.MathUtils.lerp(uniforms.uExpand.value, 0.0, 0.1);
                }
            }
        }

        // Start
        initThree();
        animate();
        cameraFeed.start();

    </script>
</body>
</html>
