            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

            letter-spacing: 1px;
            margin-bottom: 15px;
            font-weight: 600;
        }
        
        .ad-box {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 250px;
            background: #f8f9fa;
            border-radius: 10px;
            border: 2px dashed #dee2e6;
        }
        
        /* Monetag 300x250 Ad */
        .monetag-ad {

        }
        
        /* Adsterra 468x60 Ad */

        /* Adsterra 300x250 Ad */

        .footer-legal {

            border-radius: 15px;
            padding: 20px;
            margin-top: 20px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }
        
        .footer-legal h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 1.1rem;
        }
        
        .legal-links {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
        }
        
        .legal-links a {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 20px;
            background: rgba(102, 126, 234, 0.1);
            transition: all 0.3s ease;
        }
        
        .legal-links a:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        .copyright {
            margin-top: 15px;
            color: #666;
            font-size: 0.85rem;
        }
        
        @media (max-width: 600px) {
            .adsterra-banner {
