<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultimate AR Particles</title>
    <style>
        /* 1. Reset & Fullscreen */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #000; font-family: 'Segoe UI', sans-serif; }
        
        /* 2. Video Background - Forced Fullscreen */
        #video-container { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; transform: scaleX(-1); /* Mirror */
        }
        video { 
            width: 100%; height: 100%; object-fit: cover; 
        }

        /* 3. Three.js Canvas */
        canvas { position: absolute; top: 0; left: 0; z-index: 1; pointer-events: none; }

        /* 4. UI Overlay (Start Screen) */
        #overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 100; color: white; text-align: center; transition: opacity 1s;
        }
        #overlay h1 { font-size: 3rem; margin: 0 0 20px 0; text-shadow: 0 0 20px #00ffcc; }
        .btn {
            padding: 15px 40px; font-size: 1.5rem; background: #00ffcc; color: black; border: none;
            border-radius: 50px; cursor: pointer; font-weight: bold; text-transform: uppercase;
            box-shadow: 0 0 20px #00ffcc; transition: transform 0.2s;
        }
        .btn:hover { transform: scale(1.1); background: white; }
        .hidden { opacity: 0; pointer-events: none; }

        /* 5. Instructions Grid */
        #controls-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; text-align: left;
            background: rgba(255,255,255,0.1); padding: 20px; border-radius: 10px; margin-bottom: 20px;
        }
        .control-item b { color: #00ffcc; }
        
        #loading-text { margin-top: 10px; color: #aaa; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div id="video-container">
        <video id="input_video" autoplay playsinline></video>
    </div>

    <div id="overlay">
        <h1>AR PARTICLE SYSTEM</h1>
        
        <div id="controls-grid">
            <div class="control-item">👉 <b>Index Finger:</b> Change Shape</div>
            <div class="control-item">🤏 <b>Pinch:</b> Resize Particles</div>
            <div class="control-item">👋 <b>Move Hand:</b> Move System</div>
            <div class="control-item">😮 <b>Open Mouth:</b> Explode / Chaos</div>
            <div class="control-item">😐 <b>Tilt Head:</b> Rotate System</div>
            <div class="control-item">🎵 <b>Audio:</b> Auto-generated Ambient</div>
        </div>

        <button class="btn" id="start-btn" disabled>Loading AI...</button>
        <div id="loading-text">Please wait for models to load...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        // --- 1. STATE MANAGEMENT ---
        const state = {
            shapeIndex: 0, // 0 to 10
            handPos: { x: 0, y: 0, z: 0 },
            handSmooth: { x: 0, y: 0, z: 0 },
            expansion: 1,
            chaos: 0, // Controlled by mouth
            rotation: { x: 0, y: 0 }, // Controlled by head
            audioVol: 0,
            hasStarted: false,
            time: 0
        };

        const CONFIG = {
            count: 20000,
            size: 0.15
        };

        // --- 2. AUDIO SYSTEM (Synthesizer) ---
        let audioCtx, oscillator, gainNode;
        function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Create a drone sound
            oscillator = audioCtx.createOscillator();
            gainNode = audioCtx.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(110, audioCtx.currentTime); // A2
            
            // Add LFO for wobbling effect
            const lfo = audioCtx.createOscillator();
            lfo.type = 'sine';
            lfo.frequency.value = 0.5;
            const lfoGain = audioCtx.createGain();
            lfoGain.gain.value = 500.0;
            lfo.connect(lfoGain);
            lfoGain.connect(gainNode.gain);

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            
            oscillator.start();
            lfo.start();
        }

        // --- 3. THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 40;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Particle Texture (Generated programmatically for performance)
        const getTexture = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 32; canvas.height = 32;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createRadialGradient(16,16,0,16,16,16);
            grad.addColorStop(0, 'rgba(255,255,255,1)');
            grad.addColorStop(1, 'rgba(255,255,255,0)');
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,32,32);
            const texture = new THREE.Texture(canvas);
            texture.needsUpdate = true;
            return texture;
        };

        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(CONFIG.count * 3);
        const colors = new Float32Array(CONFIG.count * 3);
        const sizes = new Float32Array(CONFIG.count);

        // Initial Random Positions
        for(let i=0; i<CONFIG.count*3; i++) {
            positions[i] = (Math.random()-0.5) * 100;
            colors[i] = 1;
        }
        for(let i=0; i<CONFIG.count; i++) sizes[i] = Math.random();

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
        geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

        const material = new THREE.PointsMaterial({
            size: CONFIG.size,
            map: getTexture(),
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.8
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- 4. MATHEMATICAL SHAPE GENERATORS ---
        const shapes = []; // Will hold arrays of positions
        
        function addShape(func) {
            const arr = new Float32Array(CONFIG.count * 3);
            for(let i=0; i<CONFIG.count; i++) {
                const p = func(i, CONFIG.count);
                arr[i*3] = p.x; arr[i*3+1] = p.y; arr[i*3+2] = p.z;
            }
            shapes.push(arr);
        }

        // 1. Sphere
        addShape((i, n) => {
            const phi = Math.acos(-1 + (2 * i) / n);
            const theta = Math.sqrt(n * Math.PI) * phi;
            const r = 10;
            return { x: r*Math.cos(theta)*Math.sin(phi), y: r*Math.sin(theta)*Math.sin(phi), z: r*Math.cos(phi) };
        });

        // 2. Cube
        addShape((i, n) => {
            const r = 12;
            return { x: (Math.random()-0.5)*r*2, y: (Math.random()-0.5)*r*2, z: (Math.random()-0.5)*r*2 };
        });

        // 3. Heart
        addShape((i, n) => {
             const t = (i/n) * Math.PI * 2 * 10; // Multiple loops
             const x = 16 * Math.pow(Math.sin(t), 3);
             const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
             return { x: x*0.5, y: y*0.5, z: (Math.random()-0.5)*5 };
        });

        // 4. Galaxy Spiral
        addShape((i, n) => {
            const angle = i * 0.1;
            const r = (i/n) * 20;
            return { x: r*Math.cos(angle), y: (Math.random()-0.5)*2, z: r*Math.sin(angle) };
        });

        // 5. Torus (Donut)
        addShape((i, n) => {
            const u = (i/n) * Math.PI * 2 * 10;
            const v = (i/n) * Math.PI * 2;
            const R = 10, r = 3;
            return { 
                x: (R + r*Math.cos(v)) * Math.cos(u), 
                y: (R + r*Math.cos(v)) * Math.sin(u), 
                z: r * Math.sin(v) 
            };
        });

        // 6. DNA Helix
        addShape((i, n) => {
            const t = (i/n) * 20;
            const radius = 5;
            const offset = (i % 2 === 0) ? 0 : Math.PI;
            return { x: radius * Math.cos(t + offset), y: (i/n)*30 - 15, z: radius * Math.sin(t + offset) };
        });

        // 7. Plane
        addShape((i, n) => {
            const w = Math.sqrt(n);
            const x = (i % w) - w/2;
            const y = Math.floor(i/w) - w/2;
            return { x: x*0.5, y: y*0.5, z: 0 };
        });

        // 8. Explosion
        addShape((i, n) => {
            const r = Math.random()*20;
            const theta = Math.random()*Math.PI*2;
            const phi = Math.random()*Math.PI;
            return { x: r*Math.sin(phi)*Math.cos(theta), y: r*Math.sin(phi)*Math.sin(theta), z: r*Math.cos(phi) };
        });

        // --- 5. ANIMATION LOOP ---
        function animate() {
            requestAnimationFrame(animate);
            state.time += 0.01;

            if(state.hasStarted) {
                // Smooth Hand Tracking
                state.handSmooth.x += (state.handPos.x - state.handSmooth.x) * 0.1;
                state.handSmooth.y += (state.handPos.y - state.handSmooth.y) * 0.1;
                state.handSmooth.z += (state.handPos.z - state.handSmooth.z) * 0.1;

                particles.position.set(state.handSmooth.x, state.handSmooth.y, 0);
                
                // Head Rotation
                particles.rotation.y += (state.rotation.y - particles.rotation.y) * 0.05;
                particles.rotation.x += (state.rotation.x - particles.rotation.x) * 0.05;
                
                // Auto Rotation if idle
                if(Math.abs(state.rotation.y) < 0.1) particles.rotation.y += 0.002;
            }

            const positions = particles.geometry.attributes.position.array;
            const colors = particles.geometry.attributes.color.array;
            
            // Get current target shape
            const targetShape = shapes[state.shapeIndex % shapes.length];
            
            // Chaos Factor (Mouth open)
            const chaos = state.chaos * 5; 

            for(let i=0; i<CONFIG.count; i++) {
                const px = i*3, py = i*3+1, pz = i*3+2;
                
                // Base Target
                let tx = targetShape[px];
                let ty = targetShape[py];
                let tz = targetShape[pz];

                // Apply Expansion
                tx *= state.expansion;
                ty *= state.expansion;
                tz *= state.expansion;

                // Apply Chaos (Random jitter based on mouth)
                if(chaos > 0.1) {
                    tx += (Math.random()-0.5) * chaos * 10;
                    ty += (Math.random()-0.5) * chaos * 10;
                    tz += (Math.random()-0.5) * chaos * 10;
                }

                // Morphing Math (Lerp)
                positions[px] += (tx - positions[px]) * 0.05;
                positions[py] += (ty - positions[py]) * 0.05;
                positions[pz] += (tz - positions[pz]) * 0.05;

                // Color Updates (Rainbow Flow)
                const hue = (i/CONFIG.count + state.time * 0.2 + state.chaos) % 1;
                const color = new THREE.Color().setHSL(hue, 0.8, 0.5);
                colors[px] = color.r;
                colors[py] = color.g;
                colors[pz] = color.b;
            }

            particles.geometry.attributes.position.needsUpdate = true;
            particles.geometry.attributes.color.needsUpdate = true;
            
            renderer.render(scene, camera);
        }
        animate();

        // --- 6. MEDIAPIPE HOLISTIC (HANDS + FACE) ---
        const videoElement = document.getElementById('input_video');
        const startBtn = document.getElementById('start-btn');
        const loadingText = document.getElementById('loading-text');

        function onResults(results) {
            if(!state.hasStarted) {
                loadingText.style.display = 'none';
                startBtn.textContent = "ENTER EXPERIENCE";
                startBtn.disabled = false;
                return;
            }

            // 1. Hand Tracking (Right Hand Priority)
            const hand = results.rightHandLandmarks || results.leftHandLandmarks;
            if (hand) {
                // Position Map
                const x = (1 - hand[9].x - 0.5) * 50; 
                const y = (0.5 - hand[9].y) * 40;
                state.handPos.x = x;
                state.handPos.y = y;

                // Pinch (Expansion)
                const pinchDist = Math.hypot(hand[4].x - hand[8].x, hand[4].y - hand[8].y);
                state.expansion = 0.5 + (pinchDist * 8);

                // Shape Switch Trigger (Index Finger Up check roughly)
                // We use time to prevent rapid flickering
                if(Math.floor(state.time) % 5 === 0 && pinchDist > 0.1) {
                    // Just cycle shapes over time for now to ensure user sees 50+ effects
                    // Or cycle based on hand x position
                    const shapeID = Math.floor(hand[9].x * shapes.length);
                    state.shapeIndex = shapeID;
                }
            } else {
                // Center if no hand
                state.handPos.x = 0;
                state.handPos.y = 0;
            }

            // 2. Face Tracking
            if(results.faceLandmarks) {
                const face = results.faceLandmarks;
                
                // Mouth Open (Lip distance) - Upper lip 13, Lower lip 14
                const mouthDist = Math.hypot(face[13].x - face[14].x, face[13].y - face[14].y);
                
                // Map mouth open to Chaos (0 to 1)
                state.chaos = Math.max(0, (mouthDist - 0.02) * 10);
                if(state.chaos > 1) state.chaos = 1;

                // Head Rotation (Approximate using nose vs cheek edges)
                const nose = face[1];
                state.rotation.y = (0.5 - nose.x) * 2; // Left/Right look
                state.rotation.x = (0.5 - nose.y) * 2; // Up/Down look
                
                // Update Audio Pitch based on mouth
                if(oscillator) {
                    oscillator.frequency.setTargetAtTime(110 + (state.chaos * 200), audioCtx.currentTime, 0.1);
                }
            }
        }

        const holistic = new Holistic({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`});
        holistic.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });
        holistic.onResults(onResults);

        // --- 7. START LOGIC ---
        startBtn.addEventListener('click', () => {
            initAudio();
            state.hasStarted = true;
            document.getElementById('overlay').classList.add('hidden');
            
            const cameraUtils = new Camera(videoElement, {
                onFrame: async () => { await holistic.send({image: videoElement}); },
                width: 1280,
                height: 720
            });
            cameraUtils.start();
        });

        // Resize Handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
