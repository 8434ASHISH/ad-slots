<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileShare Ads Slot</title>
    <!-- आपकी CSS फाइल का लिंक -->
    <link rel="stylesheet" href="style.css">
    
    <!-- 💰 MONETAG / ADSTERRA SCRIPT HERE -->
    <!-- यहाँ अपना Monetag या Adsterra का ओरिजिनल स्क्रिप्ट कोड पेस्ट करें -->
    <script>(function(s,u,z,p,v,e,d){p=s.createElement(u);p.async=1;p.src=z;in=s.getElementsByTagName(u);in.parentNode.insertBefore(p,in);})(window,document,"//://heygizmo.com",window);</script>
</head>
<body>

    <div class="ads-wrapper">
        <div class="title-brand">⚡ UltraShare</div>
        <div class="subtitle-brand">P2P File Transfer - Fast & Direct</div>

        <!-- 🎯 विज्ञापन बॉक्स: यह साइज 300x250 विज्ञापन के लिए बिल्कुल परफेक्ट है -->
        <div class="ad-card">
            <span class="ad-label">Sponsored Content</span>
            <div class="ad-slot-frame">
                <!-- विज्ञापन लोड होने की जगह -->
                <div id="monetag-ad-placement"></div>
            </div>
        </div>

        <!-- 📄 लीगल फुटर सेक्शन (एक्सटेंशन और मोबाइल दोनों के लिए) -->
        <div class="legal-box">
            <div class="legal-title">📋 Legal Information</div>
            <div class="links-grid">
                <a href="privacy.html" target="_blank">Privacy Policy</a>
                <a href="disclaimer.html" target="_blank">Disclaimer</a>
                <a href="contact.html" target="_blank">Contact Us</a>
                <a href="terms.html" target="_blank">Terms</a>
            </div>
            <div class="copyright">© 2026 FileShare. All rights reserved.</div>
        </div>
    </div>

</body>
</html>
