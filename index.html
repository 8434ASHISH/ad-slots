<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FileShare Ads Slot</title>
    <style>
        /* ═══════════════════════════════════════
           🎨 ULTRASHARE PREMIUM ADS PAGE CSS
           ═══════════════════════════════════════ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            /* 🌌 Premium Dark Gradient Background */
            background: linear-gradient(145deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            overflow-x: hidden;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* ✨ Animated Background Particles Effect */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 119, 198, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* मुख्य कंटेनर */
        .ads-wrapper {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 320px;
            padding: 15px 5px;
            text-align: center;
        }

        /* ⚡ APP NAME - Rainbow Gradient Text */
        .title-brand {
            font-size: 22px;
            font-weight: 900;
            letter-spacing: 1px;
            margin-bottom: 4px;
            /* 🌈 Rainbow Gradient Text */
            background: linear-gradient(
                90deg,
                #ff0080 0%,
                #ff8c00 20%,
                #ffd700 40%,
                #00ff88 60%,
                #00bfff 80%,
                #8b5cf6 100%
            );
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: rainbowMove 3s linear infinite;
            text-shadow: none;
            filter: drop-shadow(0 0 8px rgba(255, 0, 128, 0.3));
        }

        @keyframes rainbowMove {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        /* 📝 Subtitle - Glowing Cyan */
        .subtitle-brand {
            color: #22d3ee;
            font-size: 11px;
            margin-bottom: 15px;
            font-weight: 500;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(34, 211, 238, 0.5), 0 0 20px rgba(34, 211, 238, 0.2);
        }

        /* 🎯 विज्ञापन कार्ड - Glassmorphism */
        .ad-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            padding: 10px;
            margin: 0 auto 15px auto;
            box-shadow: 
                0 8px 32px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            width: 300px;
            height: 278px;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .ad-card:hover {
            transform: translateY(-2px);
            box-shadow: 
                0 12px 40px rgba(0, 0, 0, 0.5),
                0 0 20px rgba(139, 92, 246, 0.2),
                inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        /* Ad Label - Neon Pink */
        .ad-label {
            font-size: 9px;
            color: #f472b6;
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 2px;
            display: block;
            font-weight: 600;
            text-shadow: 0 0 8px rgba(244, 114, 182, 0.4);
        }

        /* Ad Slot Frame - Dark with subtle glow */
        .ad-slot-frame {
            width: 280px;
            height: 250px;
            background: linear-gradient(145deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            border: 1px solid rgba(139, 92, 246, 0.2);
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* 📄 Legal Box - Glass Dark */
        .legal-box {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 10px;
            width: 300px;
            margin: 0 auto;
        }

        .legal-title {
            font-size: 10px;
            color: #a78bfa;
            margin-bottom: 8px;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .links-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
        }

        /* Legal Links - Neon Purple */
        .legal-box a {
            color: #c4b5fd;
            text-decoration: none;
            font-size: 10px;
            padding: 4px 10px;
            background: rgba(139, 92, 246, 0.15);
            border: 1px solid rgba(139, 92, 246, 0.2);
            border-radius: 20px;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .legal-box a:hover {
            background: linear-gradient(90deg, #8b5cf6, #ec4899);
            color: #ffffff;
            border-color: transparent;
            box-shadow: 0 0 15px rgba(139, 92, 246, 0.4);
            transform: translateY(-1px);
        }

        .copyright {
            font-size: 8px;
            color: rgba(167, 139, 250, 0.5);
            margin-top: 8px;
            letter-spacing: 0.5px;
        }

        /* 💫 Decorative Elements */
        .glow-line {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, #8b5cf6, transparent);
            margin: 8px auto;
            border-radius: 2px;
            opacity: 0.6;
        }
    </style>

    <!-- 💰 MONETAG / ADSTERRA SCRIPT -->
    <script>(function(s,u,z,p,v,e,d){p=s.createElement(u);p.async=1;p.src=z;in=s.getElementsByTagName(u);in.parentNode.insertBefore(p,in);})(window,document,"//://heygizmo.com",window);</script>
<base target="_blank">
</head>
<body>

    <div class="ads-wrapper">
        <!-- ⚡ Colorful App Name -->
        <div class="title-brand">⚡ FileShare</div>
        <div class="glow-line"></div>

        <!-- 📝 Glowing Subtitle -->
        <div class="subtitle-brand">P2P File Transfer - Fast & Direct</div>

        <!-- 🎯 Ad Card -->
        <div class="ad-card">
            <span class="ad-label">✦ Sponsored Content ✦</span>
            <div class="ad-slot-frame">
                <div id="monetag-ad-placement"></div>
            </div>
        </div>

        <!-- 📄 Legal Footer -->
        <div class="legal-box">
            <div class="legal-title">📋 Legal Information</div>
            <div class="links-grid">
                <a href="privacy.html" target="_blank">Privacy Policy</a>
                <a href="disclaimer.html" target="_blank">Disclaimer</a>
                <a href="contact.html" target="_blank">Contact Us</a>
                <a href="terms.html" target="_blank">Terms</a>
            </div>
            <div class="copyright">© 2026 FILEShare. All rights reserved.</div>
        </div>
    </div>

</body>
</html>
