<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Gesture Controlled 3D Particles</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; font-family: sans-serif; }
        canvas { display: block; }
        #video-container { position: absolute; bottom: 10px; left: 10px; width: 200px; height: 150px; z-index: 10; border: 2px solid #333; border-radius: 8px; overflow: hidden; transform: scaleX(-1); }
        video { width: 100%; height: 100%; object-fit: cover; }
        #loading { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); color: white; font-size: 24px; pointer-events: none; }
        #instructions { position: absolute; top: 10px; left: 10px; color: #00ffcc; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 8px; pointer-events: none; }
    </style>
</head>
<body>

    <div id="loading">Loading AI Models... Please allow Camera access.</div>
    <div id="instructions">
        <h3>Hand Controls</h3>
        <p>🖐 <b>Move Hand:</b> Change Color</p>
        <p>🤏 <b>Pinch/Spread:</b> Expand/Contract</p>
        <p>☝️ <b>1 Finger:</b> Sphere</p>
        <p>✌️ <b>2 Fingers:</b> Heart</p>
        <p>🤟 <b>3 Fingers:</b> Saturn</p>
        <p>🖖 <b>4 Fingers:</b> Flower</p>
        <p>🖐 <b>5 Fingers:</b> Fireworks</p>
    </div>

    <div id="video-container">
        <video id="input_video" autoplay playsinline></video>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>

    <script>
        // --- 1. CONFIGURATION ---
        const PARTICLE_COUNT = 15000;
        const PARTICLE_SIZE = 0.15;
        let currentShape = 'sphere';
        let targetPositions = []; 
        let currentPositions = [];
        
        // --- 2. THREE.JS SETUP ---
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Create Particles
        const geometry = new THREE.BufferGeometry();
        const positions = new Float32Array(PARTICLE_COUNT * 3);
        const colors = new Float32Array(PARTICLE_COUNT * 3);

        // Initialize positions
        for (let i = 0; i < PARTICLE_COUNT * 3; i++) {
            positions[i] = (Math.random() - 0.5) * 50;
            colors[i] = 1;
        }

        geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
        geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

        const material = new THREE.PointsMaterial({
            size: PARTICLE_SIZE,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            depthWrite: false,
            transparent: true,
            opacity: 0.8
        });

        const particles = new THREE.Points(geometry, material);
        scene.add(particles);

        // --- 3. SHAPE GENERATORS (Math) ---
        function getSpherePoint(i) {
            const phi = Math.acos(-1 + (2 * i) / PARTICLE_COUNT);
            const theta = Math.sqrt(PARTICLE_COUNT * Math.PI) * phi;
            const r = 10;
            return {
                x: r * Math.cos(theta) * Math.sin(phi),
                y: r * Math.sin(theta) * Math.sin(phi),
                z: r * Math.cos(phi)
            };
        }

        function getHeartPoint(i) {
            const t = (i / PARTICLE_COUNT) * Math.PI * 2;
            const x = 16 * Math.pow(Math.sin(t), 3);
            const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
            const z = (Math.random() - 0.5) * 5; // Add some depth
            const scale = 0.5;
            return { x: x * scale, y: y * scale, z: z };
        }

        function getSaturnPoint(i) {
            // 70% sphere, 30% ring
            if (i < PARTICLE_COUNT * 0.7) {
                const p = getSpherePoint(i);
                return { x: p.x * 0.6, y: p.y * 0.6, z: p.z * 0.6 };
            } else {
                const angle = (i / (PARTICLE_COUNT * 0.3)) * Math.PI * 20; // Multiple loops
                const r = 10 + Math.random() * 4;
                return {
                    x: r * Math.cos(angle),
                    y: (Math.random() - 0.5) * 1, // Flat ring
                    z: r * Math.sin(angle)
                };
            }
        }

        function getFlowerPoint(i) {
            const angle = (i / PARTICLE_COUNT) * Math.PI * 20;
            const radius = 10 * Math.cos(3 * angle); // Rose curve
            return {
                x: radius * Math.cos(angle),
                y: radius * Math.sin(angle),
                z: (Math.random() - 0.5) * 5
            };
        }

        function getFireworksPoint(i) {
            const r = Math.random() * 20;
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            return {
                x: r * Math.sin(phi) * Math.cos(theta),
                y: r * Math.sin(phi) * Math.sin(theta),
                z: r * Math.cos(phi)
            };
        }

        // Initialize target positions arrays
        const shapes = {
            'sphere': [], 'heart': [], 'saturn': [], 'flower': [], 'fireworks': []
        };

        // Pre-calculate shapes
        for (let i = 0; i < PARTICLE_COUNT; i++) {
            const s = getSpherePoint(i); shapes.sphere.push(s.x, s.y, s.z);
            const h = getHeartPoint(i); shapes.heart.push(h.x, h.y, h.z);
            const sa = getSaturnPoint(i); shapes.saturn.push(sa.x, sa.y, sa.z);
            const f = getFlowerPoint(i); shapes.flower.push(f.x, f.y, f.z);
            const fw = getFireworksPoint(i); shapes.fireworks.push(fw.x, fw.y, fw.z);
        }

        // --- 4. ANIMATION LOOP ---
        let baseColor = new THREE.Color(0x00ffcc);
        let expansion = 1.0;

        function animate() {
            requestAnimationFrame(animate);

            const positions = particles.geometry.attributes.position.array;
            const target = shapes[currentShape];

            // Morphing Logic: Lerp current position to target position
            for (let i = 0; i < PARTICLE_COUNT; i++) {
                const ix = i * 3;
                const iy = i * 3 + 1;
                const iz = i * 3 + 2;

                // Move towards target shape
                positions[ix] += (target[ix] * expansion - positions[ix]) * 0.05;
                positions[iy] += (target[iy] * expansion - positions[iy]) * 0.05;
                positions[iz] += (target[iz] * expansion - positions[iz]) * 0.05;
            }
            
            particles.geometry.attributes.position.needsUpdate = true;
            
            // Rotate the whole system slowly
            particles.rotation.y += 0.002;
            particles.material.color.lerp(baseColor, 0.05);

            renderer.render(scene, camera);
        }

        animate();

        // --- 5. MEDIAPIPE HAND TRACKING ---
        const videoElement = document.getElementById('input_video');
        
        function onResults(results) {
            document.getElementById('loading').style.display = 'none';
            
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // A. Detect Finger Count (Simple logic: Tip y < Pip y)
                // Tips: 4 (Thumb), 8 (Index), 12 (Middle), 16 (Ring), 20 (Pinky)
                // PIPs: 2, 6, 10, 14, 18
                let fingersUp = 0;
                
                // Thumb (check x distance for simplicity in 2d)
                if (landmarks[4].x < landmarks[3].x) fingersUp++; 
                // Fingers
                if (landmarks[8].y < landmarks[6].y) fingersUp++;
                if (landmarks[12].y < landmarks[10].y) fingersUp++;
                if (landmarks[16].y < landmarks[14].y) fingersUp++;
                if (landmarks[20].y < landmarks[18].y) fingersUp++;

                // B. Switch Shape based on finger count
                if (fingersUp === 1) currentShape = 'sphere';
                else if (fingersUp === 2) currentShape = 'heart';
                else if (fingersUp === 3) currentShape = 'saturn';
                else if (fingersUp === 4) currentShape = 'flower';
                else if (fingersUp >= 5) currentShape = 'fireworks';

                // C. Calculate Expansion (Index to Thumb distance)
                const dx = landmarks[4].x - landmarks[8].x;
                const dy = landmarks[4].y - landmarks[8].y;
                const distance = Math.sqrt(dx*dx + dy*dy);
                // Map distance (approx 0.05 to 0.3) to expansion (0.5 to 2.5)
                expansion = 0.5 + (distance * 8);

                // D. Control Color based on Hand Position (X/Y)
                // Hand center approx at index 9
                const cx = landmarks[9].x;
                const cy = landmarks[9].y;
                baseColor.setHSL(cx, 1.0, 0.5); // Hue based on X position
            }
        }

        const hands = new Hands({locateFile: (file) => {
            return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
        }});

        hands.setOptions({
            maxNumHands: 1,
            modelComplexity: 1,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        hands.onResults(onResults);

        const cameraUtils = new Camera(videoElement, {
            onFrame: async () => {
                await hands.send({image: videoElement});
            },
            width: 640,
            height: 480
        });
        
        cameraUtils.start();

        // Handle Window Resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

    </script>
</body>
</html>
